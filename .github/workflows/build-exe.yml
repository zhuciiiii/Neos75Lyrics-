name: Build Windows exe

# Runs on demand (Actions tab -> Build Windows exe -> Run workflow)
# and automatically when this workflow file, the source, or the
# build script changes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-exe.yml"
      - "src/**"
      - "requirements.txt"
      - "build.ps1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build exe
        shell: powershell
        run: .\build.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Neos75Lyrics-exe
          path: src/dist/Neos75Lyrics.exe
          if-no-files-found: error
          retention-days: 30
